[project]
name = "oso-arena"
version = "0.2.0"
description = "oso Arena kit: contract oso-arena/1, the badminton simulator with stat builds, scripted bot, check/export/match tools and trainer (packaging is finished in phase 14.5)"
requires-python = ">=3.10"
dependencies = ["numpy", "safetensors"]

[project.scripts]
oso-arena = "oso_arena.cli:main"

[project.optional-dependencies]
train = ["torch"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["oso_arena"]
