[project]
name = "oso-arena"
version = "0.1.0"
description = "oso Arena kit: the badminton simulator, scripted bot and trainer (packaging is finished in phase 14.5)"
requires-python = ">=3.10"
dependencies = ["numpy", "safetensors"]

[project.optional-dependencies]
train = ["torch"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["oso_arena"]
