# XcodeGen spec: `brew install xcodegen && cd apple && xcodegen` -> Oso.xcodeproj
name: Oso
options:
  bundleIdPrefix: com.oso
  deploymentTarget:
    iOS: "26.1"
    watchOS: "10.0"
packages:
  OsoKit:
    path: OsoKit
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OsoPhone:
    type: application
    platform: iOS
    sources:
      - OsoPhone
      - Shared
      - SharedLive
      - path: ../app/public/sample/imu.bin # bundled sample session
        buildPhase: resources
    dependencies:
      - package: OsoKit
      - target: OsoWatch
      - target: OsoLive
    configFiles:
      Debug: OsoPhone/Config.xcconfig
      Release: OsoPhone/Config.xcconfig
    entitlements:
      path: OsoPhone/OsoPhone.entitlements
      properties:
        com.apple.security.application-groups: [group.$(OSO_BUNDLE_PREFIX)]
        com.apple.developer.healthkit: true # read heart rate to add to a session (Add heart rate > Apple Health)
    info:
      path: OsoPhone/Info.plist
      properties:
        CFBundleDisplayName: Volante
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: Volante reads your heart rate from Apple Health to add it to a badminton session when you choose Add heart rate.
        NSHealthUpdateUsageDescription: Volante follows the badminton workout you start on your Apple Watch, so it can show it on the Lock Screen and end it with your pod session.
        UIBackgroundModes: [bluetooth-central] # a live pod session keeps streaming with the phone locked
        NSBluetoothAlwaysUsageDescription: Volante connects to the racquet pod over Bluetooth to record your swings.
        NSLocalNetworkUsageDescription: Volante talks to your Volante server on the Raspberry Pi to upload sessions and fetch replays and heart rate.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true # plain http to the Pi on the LAN (deploy/pi/README.md)
          NSExceptionDomains: # plain http to the Pi over Tailscale (WireGuard already encrypts the tailnet)
            tail05420e.ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        NSSupportsLiveActivities: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        VolanteAppGroup: group.$(OSO_BUNDLE_PREFIX)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REDIRECT_SCHEME)]
          - CFBundleURLSchemes: [volante] # Arena GitHub sign-in callback (ASWebAuthenticationSession)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OSO_BUNDLE_PREFIX).phone
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  OsoLive:
    type: app-extension
    platform: iOS
    sources:
      - OsoLive
      - SharedLive
    configFiles:
      Debug: OsoLive/Config.xcconfig
      Release: OsoLive/Config.xcconfig
    entitlements:
      path: OsoLive/OsoLive.entitlements
      properties:
        com.apple.security.application-groups: [group.$(OSO_BUNDLE_PREFIX)]
    info:
      path: OsoLive/Info.plist
      properties:
        CFBundleDisplayName: Volante
        VolanteAppGroup: group.$(OSO_BUNDLE_PREFIX)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OSO_BUNDLE_PREFIX).phone.live
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  OsoWatch:
    type: application
    platform: watchOS
    sources:
      - OsoWatch
      - Shared
    dependencies:
      - package: OsoKit
    configFiles:
      Debug: OsoWatch/Config.xcconfig
      Release: OsoWatch/Config.xcconfig
    entitlements:
      path: OsoWatch/OsoWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: OsoWatch/Info.plist
      properties:
        CFBundleDisplayName: Volante
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(OSO_BUNDLE_PREFIX).phone
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: Volante reads your heart rate and energy during badminton workouts.
        NSHealthUpdateUsageDescription: Volante saves your badminton workouts to Health.
        NSMotionUsageDescription: Volante records your wrist motion during badminton to count and measure swings.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OSO_BUNDLE_PREFIX).phone.watchkitapp
