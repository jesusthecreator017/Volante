# XcodeGen spec: `brew install xcodegen && cd apple && xcodegen` -> Oso.xcodeproj
name: Oso
options:
  bundleIdPrefix: com.oso
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  OsoKit:
    path: OsoKit
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OsoPhone:
    type: application
    platform: iOS
    sources:
      - OsoPhone
      - Shared
      - SharedLive
      - path: ../app/public/sample/imu.bin # bundled sample session
        buildPhase: resources
    dependencies:
      - package: OsoKit
      - target: OsoWatch
      - target: OsoLive
    configFiles:
      Debug: OsoPhone/Config.xcconfig
      Release: OsoPhone/Config.xcconfig
    info:
      path: OsoPhone/Info.plist
      properties:
        CFBundleDisplayName: oso
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: oso connects to the racquet pod over Bluetooth to record your swings.
        NSLocalNetworkUsageDescription: oso talks to your oso server on the Raspberry Pi to upload sessions and fetch replays and heart rate.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true # plain http to the Pi on the LAN (deploy/pi/README.md)
        NSSupportsLiveActivities: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REDIRECT_SCHEME)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OSO_BUNDLE_PREFIX).phone
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  OsoLive:
    type: app-extension
    platform: iOS
    sources:
      - OsoLive
      - SharedLive
    configFiles:
      Debug: OsoLive/Config.xcconfig
      Release: OsoLive/Config.xcconfig
    info:
      path: OsoLive/Info.plist
      properties:
        CFBundleDisplayName: oso
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OSO_BUNDLE_PREFIX).phone.live
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  OsoWatch:
    type: application
    platform: watchOS
    sources:
      - OsoWatch
      - Shared
    dependencies:
      - package: OsoKit
    configFiles:
      Debug: OsoWatch/Config.xcconfig
      Release: OsoWatch/Config.xcconfig
    entitlements:
      path: OsoWatch/OsoWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: OsoWatch/Info.plist
      properties:
        CFBundleDisplayName: oso
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(OSO_BUNDLE_PREFIX).phone
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: oso reads your heart rate and energy during badminton workouts.
        NSHealthUpdateUsageDescription: oso saves your badminton workouts to Health.
        NSMotionUsageDescription: oso records your wrist motion during badminton to count and measure swings.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OSO_BUNDLE_PREFIX).phone.watchkitapp
