[package]
name = "oso-replay"
version.workspace = true
edition.workspace = true
default-run = "oso"

[[bin]]
name = "oso"
path = "src/main.rs"

[dependencies]
oso-render.workspace = true
oso-proto.workspace = true
cgmath.workspace = true
log.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
winit.workspace = true
env_logger.workspace = true

# Racquet-pod recorder (src/bin/oso-rec.rs): native only, never in the wasm build
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
btleplug = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
futures = "0.3"
# btleplug characteristic ids are uuid::Uuid
uuid = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
console_log.workspace = true
wasm-bindgen.workspace = true
getrandom.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# The wasm-opt that wasm-pack downloads is old and rejects modern rustc output without these
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-sign-ext", "--enable-nontrapping-float-to-int", "--enable-mutable-globals", "--enable-reference-types"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "replay"
harness = false

[[bench]]
name = "body"
harness = false

[[bench]]
name = "imu"
harness = false
