[package]
name = "oso-render"
version.workspace = true
edition.workspace = true
description = "Shared wgpu renderer, scene, replay.bin format and viewer app for Replay and Arena"

[dependencies]
image.workspace = true
cgmath.workspace = true
winit.workspace = true
env_logger.workspace = true
log.workspace = true
pollster.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
anyhow.workspace = true
tobj.workspace = true
hecs.workspace = true
serde.workspace = true
serde_json.workspace = true
web-time.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_log.workspace = true
wgpu = { version = "30.0", features = ["webgl"]}
wasm-bindgen.workspace = true
js-sys.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "Node",
    "Request",
    "RequestInit",
    "Response",
    "Headers",
    "Navigator",
    "Gpu",
]}

[dev-dependencies]
# Test-only: translate the WGSL to GLSL ES like wgpu's GL backend does
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }
