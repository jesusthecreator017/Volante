# /etc/volante-deploy/deploy.conf: read by /usr/local/sbin/volante-deploy (shell syntax, root-owned). setup-runner.sh does not overwrite it.

# Replay LAN server (app/): the friend's user service
LAN_USER=itsfrosty
LAN_APP_DIR=/home/itsfrosty/oso-b/app          # dist/, server/, package.json are replaced here; data/ is never touched
LAN_UNIT=oso-replay.service                    # restarted via runuser + XDG_RUNTIME_DIR (no systemd-machined on the Pi)
LAN_HEALTH_URL=http://127.0.0.1:8090/   # / not /health: older app versions (the rollback target) have no /health

# Arena
ARENA_VENV=/opt/oso-arena/venv
ARENA_HEALTH_URL=http://127.0.0.1:8701/healthz
ARENA_SITE_URL=http://127.0.0.1:8700/
ARENA_UNITS="oso-arena-web.service oso-arena-scheduler.service oso-arena-supervisor@1.service oso-arena-supervisor@2.service"   # must be active 5 s after install
