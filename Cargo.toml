[package]
name = "oso"
version = "0.1.0"
edition = "2024"
default-run = "oso"

[workspace]
members = [".", "proto"]
# Own toolchain (esp) and target: build it from firmware/
exclude = ["firmware"]

[profile.release]
strip = true

[dependencies]
# No jpeg_rayon: wasm cannot spawn threads
image = { version = "0.23", default-features = false, features = ["jpeg", "png"] }
cgmath = "0.18"
winit = { version = "0.30", features = ["android-native-activity"] }
env_logger = "0.10"
log = "0.4"
pollster = "0.3"
wgpu = "30.0"
bytemuck = { version = "1.24", features = [ "derive" ] }
anyhow = "1.0.104"
tobj = "4"
hecs = "0.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"
oso-proto = { path = "proto" }

# Racquet-pod recorder (src/bin/oso-rec.rs): native only, never in the wasm build
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
btleplug = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
futures = "0.3"
# btleplug characteristic ids are uuid::Uuid
uuid = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wgpu = { version = "30.0", features = ["webgl"]}
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen-futures = "0.4.30"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "Node",
    "Request",
    "RequestInit",
    "Response",
    "Headers",
    "Navigator",
    "Gpu",
]}

[lib]
crate-type = ["cdylib", "rlib"]

# The wasm-opt that wasm-pack downloads is old and rejects modern rustc output without these
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-sign-ext", "--enable-nontrapping-float-to-int", "--enable-mutable-globals", "--enable-reference-types"]

[dev-dependencies]
criterion = "0.5"
# Test-only: translate the WGSL to GLSL ES like wgpu's GL backend does
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }

[[bench]]
name = "replay"
harness = false

[[bench]]
name = "body"
harness = false

[[bench]]
name = "imu"
harness = false
