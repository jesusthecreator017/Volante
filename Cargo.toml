[workspace]
resolver = "3"
members = ["crates/*", "proto"]
# Plain `cargo run --release` from the root opens Replay (bin `oso`)
default-members = ["crates/oso-replay"]
# Own toolchain (esp) and target: build it from firmware/
exclude = ["firmware"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# No jpeg_rayon: wasm cannot spawn threads
image = { version = "0.23", default-features = false, features = ["jpeg", "png"] }
cgmath = "0.18"
winit = { version = "0.30", features = ["android-native-activity"] }
env_logger = "0.10"
log = "0.4"
pollster = "0.3"
wgpu = "30.0"
bytemuck = { version = "1.24", features = [ "derive" ] }
anyhow = "1.0.104"
tobj = "4"
hecs = "0.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"
oso-proto = { path = "proto" }
oso-render = { path = "crates/oso-render" }
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen-futures = "0.4.30"

[profile.release]
strip = true
