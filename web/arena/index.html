<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Volante Arena</title>
  <link rel="stylesheet" href="arena.css">
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="3D court view"></canvas>
  <div id="status">loading...</div>
  <header id="players" aria-label="Players" hidden>
    <span class="pl" id="pl-a"><span class="name" id="pl-a-name"></span> <span class="build" id="pl-a-build" title="power / speed / reach / accuracy"></span></span>
    <span class="vs">vs</span>
    <span class="pl" id="pl-b"><span class="name" id="pl-b-name"></span> <span class="build" id="pl-b-build" title="power / speed / reach / accuracy"></span></span>
  </header>
  <section id="timeline" aria-label="Playback timeline" hidden>
    <input id="scrub" type="range" min="0" max="1" step="any" value="0" aria-label="Seek">
    <div class="row">
      <button id="step-back" type="button" aria-label="Step back one frame">&#9664;&#9664;</button>
      <button id="play" type="button" aria-label="Play or pause">&#10074;&#10074;</button>
      <button id="step-fwd" type="button" aria-label="Step forward one frame">&#9654;&#9654;</button>
      <span id="readout" role="timer" aria-live="off"></span>
      <label><span class="lbl">Speed</span>
        <select id="speed" aria-label="Playback speed">
          <option value="0.1">0.1x</option><option value="0.25">0.25x</option>
          <option value="0.5">0.5x</option><option value="1" selected>1x</option>
          <option value="1.5">1.5x</option><option value="2">2x</option>
        </select>
      </label>
      <span class="presets" role="group" aria-label="Camera">
        <button type="button" data-preset="1" aria-pressed="true">Baseline</button>
        <button type="button" data-preset="2" aria-pressed="false">Side</button>
        <button type="button" data-preset="3" aria-pressed="false">Top</button>
      </span>
    </div>
  </section>
  <div id="overlay">
    <div id="ov-status" role="status" aria-live="polite"></div>
    <progress id="ov-progress" max="1" hidden></progress>
    <div id="ov-error" role="alert"></div>
    <div id="ov-drop" hidden>Drop a match.bin here</div>
  </div>
  <script type="module" src="arena.js"></script>
</body>
</html>
