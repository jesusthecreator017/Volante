# Builds the Arena Pi bundle (arena/handoff/make_bundle.sh). Called by release.yml and deploy.yml.
# Artifact "oso-arena-pi": oso-arena-pi-<tag>.zip and SHA256SUMS (the zip's sum, checked on the Pi before anything is unpacked).
name: Bundle

on:
  workflow_call:
    inputs:
      tag:
        description: Name suffix of the zip (a version tag, or "dev")
        type: string
        default: dev

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm
      - uses: ./.github/actions/wasm-pack
      - name: Build the bundle
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python -m pip install numpy safetensors build setuptools wheel
          PYTHON=python arena/handoff/make_bundle.sh
          mkdir -p out
          cp dist/oso-arena-pi.zip "out/oso-arena-pi-$TAG.zip"
          (cd out && sha256sum "oso-arena-pi-$TAG.zip" > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oso-arena-pi
          path: out/*
