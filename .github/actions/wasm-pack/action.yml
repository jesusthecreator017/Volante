name: wasm-pack
description: wasm32 target plus a pinned wasm-pack release binary
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        rustup target add wasm32-unknown-unknown
        V=v0.15.0
        mkdir -p "$HOME/.local/bin"
        curl -fsSL "https://github.com/wasm-bindgen/wasm-pack/releases/download/$V/wasm-pack-$V-x86_64-unknown-linux-musl.tar.gz" \
          | tar -xz --strip-components=1 -C "$HOME/.local/bin" --wildcards '*/wasm-pack'
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/wasm-pack" --version
